<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NUS APEX – Past Sessions</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Source+Serif+4:ital,wght@0,300;0,400;0,600;1,300&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #1a2a3a;
    --navy-light: #243447;
    --orange: #e87722;
    --orange-light: #f5a54a;
    --white: #ffffff;
    --text: #2c2c2c;
    --text-muted: #6b6b6b;
    --border: #e2ddd8;
    --card-bg: #ffffff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Source Serif 4', Georgia, serif;
    background: var(--white);
    color: var(--text);
    font-size: 15px;
    line-height: 1.65;
  }

  .filter-section {
    background: var(--white);
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  }
  .filter-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--text-muted);
    margin-bottom: 10px;
    font-weight: 600;
  }
  .filter-chips { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; }
  .chip {
    padding: 5px 13px;
    border-radius: 20px;
    border: 1.5px solid var(--border);
    background: var(--white);
    color: var(--text-muted);
    font-size: 12.5px;
    font-family: 'Source Serif 4', serif;
    cursor: pointer;
    transition: all 0.18s ease;
    user-select: none;
    white-space: nowrap;
  }
  .chip:hover { border-color: var(--orange); color: var(--orange); }
  .chip.active { background: var(--orange); border-color: var(--orange); color: var(--white); font-weight: 600; }
  .chip.all-chip.active { background: var(--navy); border-color: var(--navy); }

  .main { max-width: 100%; margin: 0 auto; padding: 20px 24px 60px; }

  .semester-group { margin-bottom: 48px; }
  .semester-heading {
    font-family: 'Playfair Display', serif;
    font-size: 1rem;
    color: var(--orange);
    font-style: italic;
    letter-spacing: 0.02em;
    margin-bottom: 16px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }

  .session-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 22px 26px;
    margin-bottom: 14px;
    transition: box-shadow 0.2s ease, transform 0.2s ease;
    border-left: 3px solid transparent;
  }
  .session-card:hover {
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    transform: translateY(-1px);
    border-left-color: var(--orange);
  }
  .session-card.hidden { display: none; }

  .card-meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .card-date { font-size: 12px; color: var(--text-muted); letter-spacing: 0.06em; text-transform: uppercase; font-weight: 600; white-space: nowrap; }
  .card-author { font-weight: 600; font-size: 14.5px; color: var(--navy); }
  .card-affil { font-size: 13px; color: var(--text-muted); font-style: italic; }
  .card-title { font-family: 'Playfair Display', serif; font-size: 1.05rem; color: var(--text); margin: 10px 0 8px; line-height: 1.4; }

  .card-abstract {
    font-size: 13.5px; color: var(--text-muted); line-height: 1.65;
    display: none; margin-top: 10px; padding-top: 10px;
    border-top: 1px dashed var(--border);
  }
  .card-abstract.open { display: block; }

  .toggle-abstract {
    font-size: 12px; color: var(--orange); cursor: pointer; user-select: none;
    display: inline-flex; align-items: center; gap: 4px; margin-top: 6px;
    background: none; border: none; font-family: inherit; padding: 0; transition: color 0.15s;
  }
  .toggle-abstract:hover { color: var(--orange-light); }
  .toggle-abstract .arrow { transition: transform 0.2s; display: inline-block; }
  .toggle-abstract.open .arrow { transform: rotate(180deg); }

  .tag-row { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
  .tag { font-size: 11px; padding: 2px 9px; border-radius: 12px; font-weight: 600; letter-spacing: 0.04em; white-space: nowrap; }

  .tag-BehavioralandExperiment  { background: #fff8e1; color: #e65100; }
  .tag-Development               { background: #e6f5ec; color: #2a7a48; }
  .tag-EconomicHistory           { background: #f3ece0; color: #8b5e2a; }
  .tag-EnvironmentalandResource  { background: #e8f5e8; color: #2e7d32; }
  .tag-Health                    { background: #fce8e8; color: #c62828; }
  .tag-IndustrialOrganization    { background: #fff0e6; color: #c25a00; }
  .tag-InnovationandGrowth       { background: #e8f8f5; color: #1a7a6e; }
  .tag-LaborandEducation         { background: #e9f5fb; color: #1a6e91; }
  .tag-PublicandPoliticalEconomy { background: #f5e6f5; color: #7a2a87; }
  .tag-TransportandUrban         { background: #f0eaf8; color: #6a1b9a; }
 
  .no-results { text-align: center; padding: 60px 20px; color: var(--text-muted); font-style: italic; display: none; }
  .no-results.show { display: block; }
  .semester-group.hidden { display: none; }
  .load-error { text-align: center; padding: 60px 20px; color: var(--text-muted); font-style: italic; }

  .results-count { font-size: 12.5px; color: var(--text-muted); margin-bottom: 20px; letter-spacing: 0.02em; }
  .results-count span { color: var(--orange); font-weight: 600; }

  @media (max-width: 600px) {
    .filter-section { padding: 14px 16px; }
    .main { padding: 24px 12px 48px; }
    .session-card { padding: 16px 16px; }
  }
</style>
</head>
<body>

<div class="filter-section">
  <div class="filter-label">Filter by field</div>
  <div class="filter-chips" id="filterChips">
    <div class="chip all-chip active" data-field="all">All</div>
    <div class="chip" data-field="BehavioralandExperiment">Behavioral &amp; Experiment</div>
    <div class="chip" data-field="Development">Development</div>
    <div class="chip" data-field="EconomicHistory">Economic History</div>
    <div class="chip" data-field="EnvironmentalandResource">Environmental &amp; Resource</div>
    <div class="chip" data-field="Health">Health</div>
    <div class="chip" data-field="IndustrialOrganization">Industrial Organization</div>
    <div class="chip" data-field="InnovationandGrowth">Innovation &amp; Growth</div>
    <div class="chip" data-field="LaborandEducation">Labor &amp; Education</div>
    <div class="chip" data-field="PublicandPoliticalEconomy">Public &amp; Political Economy</div>
    <div class="chip" data-field="TransportandUrban">Transport &amp; Urban</div>
   
  </div>
</div>

<div class="main">
  <div class="results-count" id="resultsCount"></div>
  <div id="sessions"></div>
  <div class="no-results" id="noResults">No sessions match the selected field.</div>
</div>

<script>
  // Session data lives in sessions.json. It is fetched with a timestamp so
  // embeds (e.g. Google Sites) always show the latest version.
  const chips = document.querySelectorAll('.chip');
  const sessionsEl = document.getElementById('sessions');
  const noResults = document.getElementById('noResults');
  const resultsCount = document.getElementById('resultsCount');
  const fieldLabels = {};
  chips.forEach(chip => { fieldLabels[chip.dataset.field] = chip.textContent; });
  let activeField = 'all';

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function formatDate(iso) {
    return iso.split('-').join(' / ');
  }

  function renderCard(s) {
    const card = el('div', 'session-card');
    card.dataset.fields = s.fields.join(' ');

    const meta = el('div', 'card-meta');
    meta.append(el('span', 'card-date', formatDate(s.date)),
                el('span', 'card-author', s.author),
                el('span', 'card-affil', s.affiliation));
    card.append(meta, el('div', 'card-title', s.title));

    const tags = el('div', 'tag-row');
    s.fields.forEach(f => tags.append(el('span', 'tag tag-' + f, fieldLabels[f] || f)));
    card.append(tags);

    if (s.abstract) {
      const btn = el('button', 'toggle-abstract');
      btn.innerHTML = 'Show abstract <span class="arrow">▾</span>';
      btn.addEventListener('click', () => toggleAbstract(btn));
      card.append(btn, el('div', 'card-abstract', s.abstract));
    }
    return card;
  }

  function render(data) {
    data.forEach(group => {
      const g = el('div', 'semester-group');
      g.append(el('div', 'semester-heading', `Presentations in ${group.semester} Semester`));
      group.sessions.forEach(s => g.append(renderCard(s)));
      sessionsEl.append(g);
    });
    filterCards(activeField);
  }

  function updateCount() {
    const visible = document.querySelectorAll('.session-card:not(.hidden)').length;
    const total = document.querySelectorAll('.session-card').length;
    if (activeField === 'all') {
      resultsCount.innerHTML = `Showing all <span>${total}</span> sessions`;
    } else {
      resultsCount.innerHTML = `Showing <span>${visible}</span> of ${total} sessions`;
    }
  }

  function filterCards(field) {
    activeField = field;
    let anyVisible = false;
    document.querySelectorAll('.semester-group').forEach(group => {
      let groupVisible = false;
      group.querySelectorAll('.session-card').forEach(card => {
        const fields = card.dataset.fields.split(' ');
        const show = field === 'all' || fields.includes(field);
        card.classList.toggle('hidden', !show);
        if (show) { groupVisible = true; anyVisible = true; }
      });
      group.classList.toggle('hidden', !groupVisible);
    });
    noResults.classList.toggle('show', !anyVisible);
    updateCount();
  }

  chips.forEach(chip => {
    chip.addEventListener('click', () => {
      chips.forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      filterCards(chip.dataset.field);
    });
  });

  function toggleAbstract(btn) {
    const abstract = btn.nextElementSibling;
    const isOpen = abstract.classList.toggle('open');
    btn.classList.toggle('open', isOpen);
    btn.innerHTML = isOpen
      ? 'Hide abstract <span class="arrow">▾</span>'
      : 'Show abstract <span class="arrow">▾</span>';
  }

  fetch('sessions.json?t=' + Date.now(), { cache: 'no-store' })
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(render)
    .catch(() => {
      sessionsEl.append(el('div', 'load-error', 'Sessions could not be loaded. Please refresh the page.'));
    });
</script>
</body>
</html>
